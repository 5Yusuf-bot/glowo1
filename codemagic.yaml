workflows:
  ios-workflow:
    name: iOS Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    scripts:
      - name: Setup & Build iOS
        script: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          mkdir -p public
          cp index.html public/ 2>/dev/null || true
          cp -r site/* public/ 2>/dev/null || true
          npx cap init "Glowo" "com.transfercarki.app" --web-dir "public"
          npx cap add ios
          npx cap sync ios
          cd ios/App
          pod install || true
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO BUILD_DIR=../../build
      - name: Package IPA
        script: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/Release-iphoneos/App.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r App.ipa Payload
    artifacts:
      - build/ios/ipa/App.ipa
